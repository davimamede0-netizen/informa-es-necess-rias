<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #0400ff);
}
    h2 {
  display: grid;
  align-content: start;
  height: 20px;
  text-align: center;
}

div{
    margin-left: 140px;
    margin-right: 140px;
    background: linear-gradient(135deg, #fff000, #9B9BFF);
    border-radius: 10px;
}

select {
  font-size: 16px;
  width: 140px;
}
</style>
<body>
    <div class="div">
    <h2>Informações Necessárias</h2><br>
<p>Essa página será destinada a conhecer melhor o motorista e sua atividade profissional</p>

<form method="post" autocomplete="off">
<ul>
<li>
    Qual aplicativo você utiliza para trabalhar?<br>
<select id="motorista" name="motorista" required>
   <option>Uber</option>
   <option>99</option>
   <option>inDrive</option>
   <option>Lady Drive</option>

</select>
</li>
</ul>

 <input type="checkbox" name="motorista" value="outro">Outro<br>
<textarea name="resposta" placeholder="Digite Qual é o outro" cols="30"  rows="5"></textarea><br><br>

<label>Tempo de experiência</label><br>
<input type="text" name="experiencia" placeholder="Ex:2 anos" size="29">



</form>

    </div>
</body>
</html>
